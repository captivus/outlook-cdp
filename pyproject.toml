[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-cdp"
version = "0.1.1"
description = "Drive Outlook on the web through Chrome DevTools, with composable pre-send guards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/captivus/outlook-cdp"

[project.scripts]
outlook-cdp = "outlook_cdp.cli:main"

[tool.setuptools]
packages = ["outlook_cdp"]
